services:
  dashboard:
    build: .
    command: gunicorn --bind 0.0.0.0:5000 --workers 2 --timeout 60 app:app
    env_file:
      - path: .env
        required: false
    environment:
      DASHBOARD_HOST: 0.0.0.0
      DASHBOARD_PORT: 5000
      DATABASE_URL: sqlite:////app/instance/firewall.sqlite3
    ports:
      - "${DASHBOARD_PORT:-5000}:5000"
    volumes:
      - sws-data:/app/instance
      - ./models:/app/models:ro
    restart: unless-stopped

  proxy:
    build: .
    command: gunicorn --bind 0.0.0.0:8081 --workers 2 --timeout 60 proxy_app:app
    env_file:
      - path: .env
        required: false
    environment:
      PROXY_HOST: 0.0.0.0
      PROXY_PORT: 8081
      DATABASE_URL: sqlite:////app/instance/firewall.sqlite3
      BACKEND_URL: http://backend
    ports:
      - "${PROXY_PORT:-8081}:8081"
    volumes:
      - sws-data:/app/instance
      - ./models:/app/models:ro
    restart: unless-stopped
    depends_on:
      - backend

  backend:
    image: nginx:alpine
    volumes:
      - ./my_website:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  sws-data:
