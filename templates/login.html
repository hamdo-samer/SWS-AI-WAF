{% extends "base.html" %}
{% block title %}Yönetici Girişi | Smart Web Shield (sws){% endblock %}
{% block content %}
<section class="page-heading">
  <p class="eyebrow">YÖNETİCİ ERİŞİMİ</p>
  <h1>Güvenli giriş</h1>
</section>
<section class="panel-card form-card" style="max-width:460px">
  {% if login_error %}
  <p class="result-card blocked">{{ login_error }}</p>
  {% endif %}
  <form method="post" action="{{ url_for('login_submit') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <label for="username">Kullanıcı adı</label>
    <input id="username" name="username" autocomplete="username" required />
    <label for="password">Parola</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <button class="button" type="submit">Giriş yap</button>
  </form>
</section>
{% endblock %}
